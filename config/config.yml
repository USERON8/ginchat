# 日志配置
log:
  level: info # debug/info/warn/error
  filename: ./logs/im.log
  max_size: 100   # 单日志文件最大MB
  max_backups: 10 # 保留旧日志文件数
  max_age: 30     # 保留旧日志天数
  compress: true  # 是否压缩旧日志
server:
  port: 8080

database:
  type: postgres
  host: 127.0.0.1
  port: 5432
  username: root
  password: root
  dbname: im_db
  sslmode: disable
  max_idle_conns: 20
  max_open_conns: 100
  conn_max_lifetime: 3600

redis:
  host: 127.0.0.1
  port: 6379
  password: "root"
  db: 0
  pool_size: 100

jwt:
  secret: "your-secret-key"
  expire: 72  # 小时